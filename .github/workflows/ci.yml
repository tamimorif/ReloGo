name: CI

# Least-privilege GITHUB_TOKEN — CI only reads the repo.
permissions:
  contents: read

on:
  push:
    branches: [main, tamim]
  pull_request:

jobs:
  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Expo dependency alignment
        run: npx expo install --check
      - name: Check release configuration contract
        run: npm run check:release
      - name: Typecheck
        run: npx tsc --noEmit

  mobile-lint:
    name: Mobile lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  mobile-test:
    name: Mobile tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  mobile-native-export:
    name: Mobile native exports (Hermes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/relogo-ios-check --clear
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/relogo-android-check --clear

  admin-build:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      # Placeholders so the production bundle builds without real secrets.
      # Real values are injected by Vercel at deploy time.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  landing-build:
    name: Landing build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    env:
      # Placeholders so static export prerendering succeeds without real
      # secrets. Real values are injected by Vercel at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  db-tests:
    name: Database tests (RLS + RPCs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase (applies migrations)
        run: supabase start
      - name: Lint database schema
        # Lint project-owned SQL only. The bundled pgTAP extension currently
        # emits false errors under plpgsql_check on Postgres 17.
        run: >-
          supabase db lint --local --schema public
          --level warning --fail-on warning
      - name: Run pgTAP tests
        run: supabase test db --local supabase/tests/

  e2e-test:
    name: Supabase API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Install E2E test dependencies
        run: python -m pip install -r tests/e2e/requirements.txt
      - name: Start isolated local Supabase
        run: supabase start
      - name: Run E2E suite
        run: python -m pytest tests/e2e/ --strict-markers -ra

  support-ai-test:
    name: Support AI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify mobile and Edge question allowlists match
        run: bash scripts/check-support-questions-sync.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format, lint, and typecheck support AI
        run: >-
          deno fmt --check supabase/functions/support-ai &&
          deno lint supabase/functions/support-ai &&
          deno check --config supabase/functions/support-ai/deno.json
          supabase/functions/support-ai/index.ts
      - name: Test support AI helpers
        run: >-
          deno test --config supabase/functions/support-ai/deno.json
          supabase/functions/support-ai/geminiTransport_test.ts
          supabase/functions/support-ai/grounding_test.ts
          supabase/functions/support-ai/humanTakeover_test.ts
          supabase/functions/support-ai/supportQuestions_test.ts

  consent-version-sync:
    name: Consent version sync (mobile vs database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check consent version contract
        run: bash scripts/check-consent-version-sync.sh

  worker-compile:
    name: Worker syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile worker
        run: >-
          python -m py_compile
          worker/main.py
          worker/preflight.py
          worker/changedetect.py
          worker/reporting.py

  worker-test:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            worker/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest

  types-sync:
    name: Database types sync (mobile vs admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Database interface is byte-identical in both apps
        run: bash scripts/check-database-types-sync.sh

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, landing, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Keep high/critical as the release gate. Expo declares Metro build tools
      # in its production dependency graph, so mobile uses a fail-closed wrapper
      # that accepts only two exact, reviewed image-size advisories affecting
      # repository-controlled build assets. All other findings still fail.
      - name: Audit production dependencies
        if: matrix.app != 'mobile'
        run: npm audit --omit=dev --audit-level=high
      - name: Audit mobile production dependencies
        if: matrix.app == 'mobile'
        run: npm run audit:production
