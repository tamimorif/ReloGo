name: CI

# Least-privilege GITHUB_TOKEN — CI only reads the repo.
permissions:
  contents: read

on:
  push:
    branches: [main, tamim]
  pull_request:

jobs:
  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Expo dependency alignment
        run: npx expo install --check
      - name: Typecheck
        run: npx tsc --noEmit

  mobile-test:
    name: Mobile tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  mobile-native-export:
    name: Mobile native exports (Hermes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/relogo-ios-check --clear
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/relogo-android-check --clear

  admin-build:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      # Placeholders so the production bundle builds without real secrets.
      # Real values are injected by Vercel at deploy time.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  landing-build:
    name: Landing build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    env:
      # Placeholders so static export prerendering succeeds without real
      # secrets. Real values are injected by Vercel at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  db-tests:
    name: Database tests (RLS + RPCs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Start local Supabase (applies migrations)
        run: supabase start
      - name: Lint database schema
        run: supabase db lint --local --level warning
      - name: Run pgTAP tests
        run: supabase test db --local supabase/tests/

  support-ai-test:
    name: Support AI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mobile and Edge question allowlists match
        run: bash scripts/check-support-questions-sync.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test support AI helpers
        run: >-
          deno test
          supabase/functions/support-ai/grounding_test.ts
          supabase/functions/support-ai/humanTakeover_test.ts
          supabase/functions/support-ai/supportQuestions_test.ts

  worker-compile:
    name: Worker syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile worker
        run: >-
          python -m py_compile
          worker/main.py
          worker/changedetect.py
          worker/reporting.py

  worker-test:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest

  types-sync:
    name: Database types sync (mobile vs admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Database interface is byte-identical in both apps
        run: bash scripts/check-database-types-sync.sh
