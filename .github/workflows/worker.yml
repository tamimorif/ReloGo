name: Worker — rule monitor

# Daily scheduled run of the Playwright scraper (worker/main.py). It fingerprints
# each official government page (SHA-256) and files a PENDING rule-change alert
# when the content changes — humans then approve via the admin dashboard. The
# worker never edits live rules.
#
# Free: runs on GitHub-hosted runners; no always-on host or paid plan needed.
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions → New secret):
#   SUPABASE_URL               — https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  — a current secret/service-role key (bypasses
#                                RLS; worker-only, never ship it in a client)
# The worker exits 1 with a clear log line if either is missing.
#
# OPTIONAL repo secrets:
#   ALERT_WEBHOOK_URL          — Slack-compatible incoming-webhook URL; when set
#                                the worker POSTs a short summary whenever new
#                                PENDING alerts are filed, any source fails, or
#                                a stale compare-and-swap outcome is observed.
#                                Unset = no webhook.

# Least-privilege GITHUB_TOKEN — the scraper only reads the repo.
permissions:
  contents: read

# Queue overlapping schedule/manual runs instead of interrupting an in-flight
# baseline transaction. The database CAS remains the final concurrency guard.
concurrency:
  group: relogo-rule-monitor
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily (off-peak)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  monitor:
    name: Run rule-monitor worker
    # Playwright 1.44's Linux dependency installer targets Ubuntu 22.04.
    # ubuntu-latest now resolves to 24.04, where libasound2 was replaced by
    # libasound2t64 and `playwright install --with-deps` fails before scraping.
    runs-on: ubuntu-22.04
    # Includes browser installation plus bounded retries across all sources.
    timeout-minutes: 35
    env:
      # Job scope makes the sanitized failure notifier's `if:` reliable;
      # GitHub does not expose `secrets.*` directly in conditional expressions.
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r worker/requirements.txt

      - name: Validate production backend, key, and schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python worker/preflight.py

      - name: Install Chromium + OS dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SCRAPE_CONCURRENCY: "8"
          MAX_HTML_TEXT_CHARS: "1000000"
        run: python worker/main.py

      - name: Notify on workflow-level failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        continue-on-error: true
        run: >-
          curl --fail --silent --show-error
          -H 'Content-Type: application/json'
          --data "{\"text\":\"ReloGo rule monitor failed before completion: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          "$ALERT_WEBHOOK_URL"
