name: Public uptime

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-uptime
  cancel-in-progress: true

jobs:
  check:
    name: Web, auth, and checklist backend
    # Manual dispatch is always available. Scheduled probes stay quiet until
    # the current /support build is live and an owner explicitly enables them.
    if: github.event_name == 'workflow_dispatch' || vars.UPTIME_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANDING_BASE_URL: ${{ vars.LANDING_BASE_URL || 'https://relogo-two.vercel.app' }}
      ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || 'https://relo-go.vercel.app' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
      REQUIRE_SUPABASE_CHECK: "true"
      # Job scope makes this available when GitHub evaluates the step `if:`.
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check public routes and page markers
        run: bash scripts/check-public-uptime.sh

      - name: Notify on availability failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        continue-on-error: true
        run: >-
          curl --fail --silent --show-error
          -H 'Content-Type: application/json'
          --data "{\"text\":\"ReloGo availability check failed: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          "$ALERT_WEBHOOK_URL"
